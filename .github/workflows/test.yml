name: Test

defaults:
  run:
    shell: bash

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      checks: write
    steps:
    - uses: actions/checkout@v7
    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10.1.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        cache-suffix: py${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync --group test
    - name: Run tests
      env:
        PREPARE_TEST_GIT_MODE: https
      run: uv run pytest --cov --cov-report=xml --junitxml=tests.xml
    - name: Test Report
      uses: mikepenz/action-junit-report@v6
      if: success() || failure()
      with:
        check_name: Test Results (Python ${{ matrix.python-version }}, ${{ matrix.os }})
        report_paths: tests.xml

  typecheck:
    strategy:
      matrix:
        python-version: [ "3.12" ]
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: typecheck
      - name: Install dependencies
        run: uv sync --group test
      - name: Type checker
        run: uv run mypy prepare_assignment
